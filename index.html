<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>Picapool — What's your PG buying every month?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF4B18;
    --orange-dark:#D93D0F;
    --ink:#15130F;
    --ink-soft:#5B5449;
    --ink-faint:#A69C90;
    --white:#FFFFFF;
    --cream:#FFF4EB;
    --cream-deep:#FFE7D6;
    --violet:#6C4CF1;
    --teal:#0FAE86;
    --gold:#FFC94D;
    --line:rgba(21,19,15,0.14);
    --shadow-hard:4px 4px 0 var(--ink);
    --shadow-hard-sm:3px 3px 0 var(--ink);
    --radius-lg:22px;
    --radius-md:16px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Manrope', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--cream-deep);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
  }
  button, input{ font-family:inherit; }

  /* Fixed 9:16 frame, sized by JS to fit any viewport while keeping the exact ratio */
  .app{
    background:var(--white);
    display:flex;
    flex-direction:column;
    position:relative;
    border-radius:26px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(21,19,15,0.35);
    border:1px solid rgba(21,19,15,0.08);
  }

  /* ---------- brand header ---------- */
  .brand-header{ display:flex; align-items:center; gap:8px; padding:14px 18px 0; flex-shrink:0; }
  .brand-mark{ width:26px; height:26px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brand-mark svg{ width:100%; height:100%; }
  .brand-word{ font-family:var(--font-display); font-weight:800; font-size:15px; letter-spacing:-0.01em; color:var(--ink); }

  /* ---------- top bar ---------- */
  .topbar{ display:flex; align-items:center; gap:10px; padding:10px 18px 10px; flex-shrink:0; position:relative; }

  .icon-btn{ width:34px; height:34px; border-radius:50%; border:2px solid var(--ink); background:var(--white); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; cursor:pointer; flex-shrink:0; visibility:hidden; }
  .icon-btn.show{ visibility:visible; }
  .icon-btn:active{ background:var(--cream); }
  .progress-track{ flex:1; height:7px; background:var(--cream); border-radius:999px; overflow:hidden; visibility:hidden; }
  .progress-track.show{ visibility:visible; }
  .progress-fill{ height:100%; width:0%; background:var(--orange); border-radius:999px; transition:width .4s cubic-bezier(.4,0,.2,1); }
  .step-tag{ font-size:12px; font-weight:700; color:var(--ink-faint); white-space:nowrap; visibility:hidden; }
  .step-tag.show{ visibility:visible; }

  /* ---------- content ---------- */
  .content{ flex:1; overflow-y:auto; padding:8px 22px 28px; -webkit-overflow-scrolling:touch; }
  .content::-webkit-scrollbar{ width:0; }

  .screen{ display:flex; flex-direction:column; min-height:100%; animation:rise .45s cubic-bezier(.2,.8,.25,1); }
  @keyframes rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion:reduce){ .screen{ animation:none; } .progress-fill{ transition:none; } }

  .tag{ display:inline-flex; align-items:center; gap:7px; background:var(--cream); border:1.5px solid var(--line); color:var(--orange-dark); font-weight:700; font-size:13px; padding:7px 13px; border-radius:999px; margin-bottom:16px; width:fit-content; }
  .tag .dot{ width:7px; height:7px; border-radius:50%; background:var(--teal); flex-shrink:0; }

  h1{ font-family:var(--font-display); font-weight:700; font-size:27px; line-height:1.16; letter-spacing:-0.01em; margin:0 0 10px; }
  p.sub{ font-size:15px; line-height:1.5; color:var(--ink-soft); margin:0 0 6px; max-width:34ch; }
  p.sub strong{ color:var(--ink); font-weight:700; }
  p.sub-punch{ font-family:var(--font-display); font-weight:700; font-size:19px; line-height:1.3; color:var(--ink); margin:2px 0 8px; }

  .hero{ display:flex; justify-content:center; margin:14px 0 6px; }
  .hero svg{ width:88%; max-width:280px; height:auto; }
  .hero.tight{ margin:8px 0 2px; }
  .hero.tight svg{ max-width:220px; }
  .hero.small svg{ max-width:170px; }

  .tagline-hook{ font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--orange-dark); text-align:center; margin:4px 0 4px; }

  /* mascot avatar row — name screen */
  .avatar-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin:14px 0 18px; }
  .mini-avatar{ width:42px; height:42px; border-radius:50%; overflow:hidden; flex-shrink:0; opacity:.9; background:var(--ink); }
  .mini-avatar img{ width:100%; height:100%; display:block; object-fit:cover; }
  .mini-avatar.you{ position:relative; width:62px; height:62px; border:3px solid var(--orange); box-shadow:0 0 0 4px rgba(255,75,24,.15); opacity:1; }
  .mini-avatar.you .spark{ position:absolute; font-size:14px; color:var(--gold); z-index:2; }
  .mini-avatar.you .spark-a{ top:-10px; left:-8px; }
  .mini-avatar.you .spark-b{ bottom:-8px; right:-10px; }

  .squad-strip{ display:flex; align-items:center; gap:14px; background:var(--cream); border:2px solid var(--line); border-radius:18px; padding:12px 16px; margin-top:16px; }
  .squad-art{ height:44px; width:auto; flex-shrink:0; }
  .squad-caption{ font-size:12px; font-weight:700; color:var(--ink-soft); line-height:1.3; }

  .spacer{ flex:1; min-height:14px; }

  .stat-strip{ display:flex; align-items:center; gap:8px; background:var(--ink); color:var(--white); font-size:12.5px; font-weight:700; padding:9px 14px; border-radius:999px; width:fit-content; margin-top:16px; }
  .stat-strip .live-dot{ width:7px; height:7px; border-radius:50%; background:#4ADE80; box-shadow:0 0 0 3px rgba(74,222,128,0.25); }

  /* ---------- fields ---------- */
  .field{ width:100%; padding:16px 17px; font-size:16px; font-weight:600; color:var(--ink); background:var(--cream); border:2px solid transparent; border-radius:var(--radius-md); outline:none; margin:6px 0 8px; transition:border-color .15s, background .15s; }
  .field::placeholder{ color:var(--ink-faint); font-weight:500; }
  .field:focus{ border-color:var(--orange); background:var(--white); }
  .hint{ font-size:12.5px; color:var(--ink-faint); margin:0 0 4px; font-weight:600; }

  /* ---------- buttons ---------- */
  .actions{ flex-shrink:0; padding:12px 22px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:16px; font-weight:800; font-size:15.5px; border-radius:17px; border:2.5px solid var(--ink); cursor:pointer; transition:transform .1s, box-shadow .1s, opacity .15s; text-decoration:none; }
  .btn-primary{ background:var(--orange); color:var(--white); box-shadow:var(--shadow-hard); }
  .btn-primary:active{ transform:translate(3px,3px); box-shadow:none; }
  .btn-primary:disabled{ background:var(--cream); color:var(--ink-faint); border-color:var(--line); box-shadow:none; cursor:not-allowed; }
  .btn-dark{ background:var(--ink); color:var(--white); box-shadow:3px 3px 0 var(--orange); }
  .btn-dark:active{ transform:translate(3px,3px); box-shadow:none; }
  .btn-ghost{ background:var(--white); color:var(--ink); box-shadow:var(--shadow-hard-sm); }
  .btn-ghost:active{ transform:translate(2px,2px); box-shadow:none; }
  .btn-whatsapp{ background:#1E8E4F; border-color:var(--ink); color:var(--white); box-shadow:var(--shadow-hard); }
  .btn-whatsapp:active{ transform:translate(3px,3px); box-shadow:none; }

  .skip-link{ background:none; border:none; color:var(--ink-faint); font-weight:700; font-size:13.5px; text-align:center; padding:4px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  /* ---------- refer strip ---------- */
  .refer-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--cream); border:2px dashed var(--ink-faint); border-radius:var(--radius-md); padding:14px 16px; margin:16px 0 4px; }
  .refer-card p{ margin:0; font-size:13px; font-weight:700; line-height:1.35; max-width:20ch; }
  .refer-btn{ flex-shrink:0; background:var(--ink); color:var(--white); border:none; border-radius:12px; padding:10px 14px; font-weight:800; font-size:12.5px; cursor:pointer; white-space:nowrap; }
  .refer-btn:active{ opacity:.8; }

  /* ---------- chips ---------- */
  .chip-grid{ display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 4px; }
  .chip-grid.symmetric{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .chip-grid.symmetric .chip{ width:100%; margin:0; min-height:50px; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.25; padding:10px 12px; }
  .chip-grid.symmetric .chip.span-2{ grid-column:1 / -1; }
  .chip{ padding:11px 16px; border-radius:999px; font-weight:700; font-size:14px; cursor:pointer; border:2px solid var(--ink); background:var(--white); color:var(--ink); user-select:none; transition:transform .1s, background .12s, color .12s; }
  .chip:active{ transform:scale(.96); }
  .chip.active{ background:var(--orange); color:var(--white); }
  .chip.chip-sm{ padding:9px 13px; font-size:13px; }

  .count-pill{ font-size:12.5px; font-weight:700; color:var(--orange-dark); margin:6px 0 0; }

  /* ---------- accordion groups ---------- */
  .group{ border:2px solid var(--ink); border-radius:18px; margin-bottom:10px; overflow:hidden; background:var(--white); transition:border-color .25s ease; }
  .group-head{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; cursor:pointer; gap:10px; }
  .group-head-left{ display:flex; align-items:center; gap:11px; min-width:0; flex:1; }
  .group-head-text{ min-width:0; overflow:hidden; }
  .group-head-text .group-title{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .group-icon{ width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .group-title{ font-weight:800; font-size:15px; display:block; }
  .group-picked{ font-size:11.5px; font-weight:700; margin-top:1px; }
  .group-head-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .group-check{ width:20px; height:20px; border-radius:50%; color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .chev{ font-size:13px; font-weight:800; transition:transform .25s ease; color:var(--ink-faint); }
  .group.open .chev{ transform:rotate(180deg); }
  .group-body{ max-height:0; overflow:hidden; transition:max-height .32s ease; }
  .group.open .group-body{ max-height:220px; }
  .group-body-inner{ padding:0 16px 16px; border-top:2px solid var(--line); margin-top:-1px; padding-top:14px; }

  .group-progress{ display:flex; align-items:center; gap:9px; margin:6px 0 14px; }
  .group-progress-dots{ display:flex; gap:5px; }
  .gdot{ width:9px; height:9px; border-radius:50%; border:2px solid var(--line); background:transparent; }
  .gdot.filled{ border-width:0; }
  .group-progress-label{ font-size:12px; font-weight:700; color:var(--ink-faint); }

  /* ---------- commitment cards ---------- */
  .opt-list{ display:flex; flex-direction:column; gap:10px; margin:8px 0 4px; }
  .opt-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px; border-radius:18px; border:2.5px solid var(--ink); background:var(--white); cursor:pointer; transition:background .12s,color .12s; }
  .opt-card .opt-text{ font-weight:800; font-size:15px; }
  .opt-card .opt-sub{ font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-top:2px; }
  .opt-card .tick{ width:24px; height:24px; border-radius:50%; border:2.5px solid var(--ink); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; }
  .opt-card.active{ background:var(--orange); }
  .opt-card.active .opt-text, .opt-card.active .opt-sub{ color:var(--white); }
  .opt-card.active .tick{ background:var(--ink); border-color:var(--ink); color:var(--gold); }

  /* ---------- fomo cards — icon led, minimal copy ---------- */
  .fomo-card{ display:flex; align-items:center; gap:14px; border-radius:20px; padding:14px 16px; color:var(--white); margin-bottom:10px; border:2.5px solid var(--ink); }
  .fomo-purple{ background:var(--violet); }
  .fomo-teal{ background:var(--teal); }
  .fomo-pink{ background:var(--orange); }
  .fomo-icon{ width:52px; height:52px; flex-shrink:0; background:rgba(255,255,255,.92); border-radius:14px; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; padding:8px; }
  .fomo-icon svg{ width:100%; height:100%; }
  .fomo-body{ flex:1; min-width:0; }
  .fomo-num{ font-family:var(--font-display); font-weight:700; font-size:21px; line-height:1.1; margin-bottom:2px; }
  .fomo-label{ font-size:12.5px; font-weight:700; opacity:.9; }


  /* ---------- final page — reworked ---------- */
  .final-hero{ display:flex; justify-content:center; margin:0 0 10px; position:relative; }
  .final-hero svg{ width:78%; max-width:230px; }
  .cta-card{ display:flex; align-items:center; gap:13px; border-radius:20px; padding:14px 15px; margin-bottom:10px; border:2.5px solid var(--ink); }
  .cta-card.dark{ background:var(--ink); }
  .cta-card.orange{ background:var(--orange); }
  .cta-icon{ width:46px; height:46px; flex-shrink:0; background:rgba(255,255,255,.95); border-radius:13px; display:flex; align-items:center; justify-content:center; padding:8px; }
  .cta-icon svg{ width:100%; height:100%; }
  .cta-text{ flex:1; min-width:0; }
  .cta-title{ color:var(--white); font-weight:800; font-size:14.5px; line-height:1.25; margin-bottom:2px; }
  .cta-sub{ color:rgba(255,255,255,.78); font-size:11.5px; font-weight:600; }
  .cta-go{ flex-shrink:0; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.16); color:var(--white); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; text-decoration:none; }
  .final-app-link{ display:flex; align-items:center; justify-content:center; gap:8px; background:var(--cream); border:2px solid var(--line); border-radius:999px; padding:11px 16px; font-weight:700; font-size:12.5px; color:var(--ink-soft); text-decoration:none; width:fit-content; margin:6px auto 0; }

  .confetti{ position:relative; height:0; }
  .confetti span{ position:absolute; top:-10px; width:8px; height:8px; opacity:0; animation:fall 1.6s ease-in forwards; }
  @keyframes fall{ 0%{ opacity:1; transform:translateY(0) rotate(0deg);} 100%{ opacity:0; transform:translateY(140px) rotate(280deg);} }

  .center{ text-align:center; }
  .small-link{ background:none; border:none; color:var(--ink-faint); font-weight:700; font-size:12.5px; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }

  ::selection{ background:var(--gold); color:var(--ink); }
</style>
</head>

<script>
/* =========================================================
   FRAME SIZING — keep an exact 9:16 box on any screen
========================================================= */
const appEl = document.querySelector('.app');
function sizeApp(){
  const maxW = window.innerWidth * 0.96;
  const maxH = window.innerHeight * 0.96;
  let w = Math.min(maxW, 420);
  let h = w * 16 / 9;
  if(h > maxH){ h = maxH; w = h * 9 / 16; }
  appEl.style.width = w + 'px';
  appEl.style.height = h + 'px';
}
sizeApp();
window.addEventListener('resize', sizeApp);

/* =========================================================
   DATA
========================================================= */
const WHATSAPP_GROUP_LINK = 'https://chat.whatsapp.com/IYjvfNiB0jr24nKAVj6Oqo';
const BUYING_GROUP_LINK   = 'https://chat.whatsapp.com/REPLACE_WITH_BUYING_GROUP_LINK';
/* Instally smart link — already detects iOS vs Android vs desktop and
   routes to the right store (App Store id 6480370782 / Play com.picapool),
   so the app CTA doesn't need its own device-sniffing branch. */
const APP_SMART_LINK      = 'https://picapool.instally.io/q18wya';

/* =========================================================

========================================================= */
const STORAGE_KEY = 'picapool_intent_state_v1';
const SESSION_KEY = 'picapool_intent_session_v1';

function newSessionId(){
  return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
}

/* The session id lives in localStorage and deliberately never rotates —
   that's what makes "come back tomorrow and resume on the same screen"
   work, and it's why the backend UPSERTS on sessionId rather than
   appending. The flip side: filling the form again in the same browser
   rewrites your existing row, it does not create a second one.

   ?new=1 (or ?fresh=1) wipes the stored session and progress and starts
   over as a brand-new respondent — for testing, and for a shared/demo
   device where the next person must not inherit the last one's answers. */
function isFreshRequest(){
  try{
    const q = new URLSearchParams(window.location.search);
    return q.has('new') || q.has('fresh');
  }catch(e){ return false; }
}

function getSessionId(){
  try{
    if(isFreshRequest()){
      localStorage.removeItem(STORAGE_KEY);
      const fresh = newSessionId();
      localStorage.setItem(SESSION_KEY, fresh);
      return fresh;
    }
    let id = localStorage.getItem(SESSION_KEY);
    if(!id){
      id = newSessionId();
      localStorage.setItem(SESSION_KEY, id);
    }
    return id;
  }catch(e){ return newSessionId(); }
}
const SESSION_ID = getSessionId();

function makeCode(len){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i=0;i<len;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}

function getUrlSlug(){
  const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
  const parts = path.split('/').filter(Boolean);
  return parts.length ? parts[parts.length - 1] : '';
}
function getUrlParam(name){
  try{ return new URLSearchParams(window.location.search).get(name) || ''; }catch(e){ return ''; }
}

const urlSlug = getUrlSlug();
const entrySlug = urlSlug && !REDIRECT_SLUGS[urlSlug.toLowerCase()] ? urlSlug : (getUrlParam('s') || getUrlParam('slug') || 'direct');
const incomingRef = getUrlParam('ref') || getUrlParam('r') || '';

function detectDevice(){
  const ua = navigator.userAgent || '';
  if(/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if(/Android/i.test(ua)) return 'android';
  return 'desktop';
}
const DEVICE = detectDevice();

/* fire-and-forget POST, avoids CORS preflight against Apps Script.
   Prefers sendBeacon: unlike fetch(), it's guaranteed by the browser to
   still be attempted even if the tab closes/navigates right after this
   call — critical since a lot of taps happen right before someone leaves
   (closes the tab, or switches to WhatsApp). */
function beacon(payload){
  if(!API_BASE || API_BASE.indexOf('REPLACE_WITH') === 0){ return; }
  const body = JSON.stringify(payload);
  try{
    if(navigator.sendBeacon){
      const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      const ok = navigator.sendBeacon(API_BASE, blob);
      if(ok) return;
    }
  }catch(e){}
  try{
    fetch(API_BASE, {
      method: 'POST',
      mode: 'no-cors',
      keepalive: true,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: body
    }).catch(()=>{});
  }catch(e){}
}

function trackSlugEvent(slug, kind, extra){
  beacon(Object.assign({
    action: 'track',
    slug: slug,
    kind: kind, // 'visit' | 'click'
    sessionId: SESSION_ID,
    device: DEVICE,
    ts: Date.now(),
    ua: navigator.userAgent || ''
  }, extra || {}));
}

function logEvent(screenId, action){
  state.events.push({ t: Date.now(), screen: screenId, action: action || 'view' });
  if(state.events.length > 300) state.events = state.events.slice(-300);
}

/* records a click on a specific outbound link (WA group, buying group, app
   download, referral share/copy) against THIS user's own Submissions row,
   not just the aggregate Slug counter — so opening that row next to their
   name/phone shows exactly what they did and when. */
function logClick(type){
  state.clicks[type] = Date.now();
  logEvent(currentId(), 'click_' + type);
  flushProgress();
}

/* =========================================================
   BRAND SELECTIONS → flat, readable rows

   state.brandSel carries two shapes, depending on cat.kind:
     flat    cat.id -> { picks:[], other:'', otherOn:bool }
     nested  cat.id -> { group.id: { picks:[], other:'', otherOn:bool } }
   Every consumer downstream (the Sheet's readable columns, the "filled"
   counter, the Brands tab) goes through brandRows(), so those two shapes
   are special-cased in exactly one place.

   A brand typed into an "Others" box is a row like any other, flagged
   source:'typed' — that's the only difference between a tapped chip and
   a hand-written brand, and the Sheet keeps both distinguishable.
========================================================= */
function brandRows(){
  const rows = [];
  CATEGORY_META.forEach(cat => {
    const sel = state.brandSel[cat.id];
    if(!sel) return;
    const collect = (group, sub) => {
      if(!sub) return;
      (sub.picks || []).forEach(b => rows.push({
        catId: cat.id, cat: cat.label,
        group: group ? group.label : '',
        brand: b, typed: false
      }));
      const typed = (sub.other || '').trim();
      if(typed) rows.push({
        catId: cat.id, cat: cat.label,
        group: group ? group.label : '',
        brand: typed, typed: true
      });
    };
    if(cat.kind === 'flat') collect(null, sel);
    else (cat.groups || []).forEach(g => collect(g, sel[g.id]));
  });
  return rows;
}

/* "Supplements > Protein" / "Quick Bites & Munchies" */
function brandRowLabel(r){ return r.group ? r.cat + ' > ' + r.group : r.cat; }

/* one cell a human can read at a glance:
   "Supplements > Protein: MuscleBlaze, NakPro | Skincare > Sunscreen: Foxtale" */
function brandsPickedText(){
  const byGroup = [];
  const index = {};
  brandRows().forEach(r => {
    const k = brandRowLabel(r);
    if(index[k] === undefined){ index[k] = byGroup.length; byGroup.push([k, []]); }
    byGroup[index[k]][1].push(r.typed ? r.brand + ' (typed)' : r.brand);
  });
  return byGroup.map(e => e[0] + ': ' + e[1].join(', ')).join(' | ');
}

/* only what they hand-typed into an Others box, so it can be scanned for
   brands worth adding as chips next round */
function brandsTypedText(){
  return brandRows().filter(r => r.typed)
    .map(r => brandRowLabel(r) + ': ' + r.brand).join(' | ');
}

/* how many of the chosen categories they actually answered — counts a
   nested category as filled if ANY of its groups has a pick or typed brand */
function filledCategoryCount(){
  const seen = {};
  brandRows().forEach(r => { seen[r.catId] = true; });
  return Object.keys(seen).length;
}

function saveLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      pos: state.pos, order: state.order, name: state.name, phone: state.phone,
      categories: state.categories, otherCategoryText: state.otherCategoryText,
      brandSel: state.brandSel, openGroup: state.openGroup, commitment: state.commitment,
      timeRemaining: state.timeRemaining, events: state.events, myRefCode: state.myRefCode,
      clicks: state.clicks
    }));
  }catch(e){}
}

function restoreLocal(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    Object.assign(state, saved);
    state.gameActive = false;
    return true;
  }catch(e){ return false; }
}

function buildSubmissionPayload(status){
  const catCount = state.order.filter(s => catMeta(s)).length;
  const rows = brandRows();
  return {
    action: 'submit',
    sessionId: SESSION_ID,
    ts: Date.now(),
    status: status, // 'partial' | 'complete'
    slug: entrySlug,
    referredBy: incomingRef,
    myRefCode: state.myRefCode || '',
    name: state.name,
    phone: state.phone,
    categories: state.categories.join(', '),
    otherCategoryText: state.otherCategoryText,
    categoriesFilled: filledCategoryCount(),
    categoriesTotal: catCount,
    brandSelJSON: JSON.stringify(state.brandSel),
    /* readable mirrors of brandSelJSON — the Sheet shows these, the raw
       JSON stays as the lossless backup */
    brandsPicked: brandsPickedText(),
    brandsTyped: brandsTypedText(),
    brandCount: rows.length,
    /* already carries the category/group LABELS, so the Apps Script can
       explode it into the Brands tab without duplicating CATEGORY_META */
    brandRowsJSON: JSON.stringify(rows.map(r => [r.cat, r.group, r.brand, r.typed ? 'typed' : 'preset'])),
    commitment: state.commitment || '',
    currentScreen: currentId(),
    screensReached: state.pos,
    totalScreens: state.order.length - 1,
    waGroupClickedAt: state.clicks.wa_group || '',
    buyingGroupClickedAt: state.clicks.buying_group || '',
    appDownloadClickedAt: state.clicks.app_download || '',
    referralSharedAt: state.clicks.referral_share || '',
    referralCopiedAt: state.clicks.ref_copy || '',
    device: DEVICE,
    userAgent: navigator.userAgent || '',
    eventsJSON: JSON.stringify(state.events.slice(-100))
  };
}

let syncTimer = null;
function flushProgress(){
  if(syncTimer){ clearTimeout(syncTimer); syncTimer = null; }
  const status = currentId() === 'final' ? 'complete' : 'partial';
  beacon(buildSubmissionPayload(status));
}
function syncProgress(){
  saveLocal();
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(flushProgress, 700);
}

/* the debounce above is fine while the user is actively tapping through,
   but if they close the tab / switch apps before it fires, that setTimeout
   never runs and the latest state is lost. Force an immediate flush the
   moment the tab is hidden or the page is about to unload. */
window.addEventListener('pagehide', flushProgress);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') flushProgress();
});

function ensureReferralCode(){
  if(state.myRefCode) return state.myRefCode;
  state.myRefCode = makeCode(6);
  beacon({
    action: 'createLink',
    slug: state.myRefCode,
    type: 'referral',
    owner: state.name || state.phone || 'anonymous',
    sessionId: SESSION_ID,
    ts: Date.now()
  });
  saveLocal();
  return state.myRefCode;
}
function referralUrl(){
  return window.location.origin + '/' + ensureReferralCode();
}

/* ---- resolve redirect shortlinks before anything renders ---- */
let REDIRECTING = false;
(function resolveRedirectSlug(){
  const key = urlSlug.toLowerCase();
  const target = REDIRECT_SLUGS[key];
  if(target){
    REDIRECTING = true;
    trackSlugEvent(key, 'click', { redirectType: target.type });
    window.location.replace(target.dest);
  }
})();

/* ---- restore progress, else log fresh visit ---- */
const RESUMED = restoreLocal();
trackSlugEvent(entrySlug, 'visit', { resumed: RESUMED, ref: incomingRef });

/* =========================================================
   AUDIO - Web Audio API Sound Effects
========================================================= */
const audioContext = new (window.AudioContext || window.webkitAudioContext)();

function playChipSound(){
  const now = audioContext.currentTime;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.frequency.setValueAtTime(800, now);
  osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
  osc.start(now);
  osc.stop(now + 0.1);
}

function playDialSound(){
  const now = audioContext.currentTime;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.frequency.setValueAtTime(400, now);
  osc.frequency.linearRampToValueAtTime(600, now + 0.15);
  gain.gain.setValueAtTime(0.25, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
  osc.start(now);
  osc.stop(now + 0.15);
}

function playVictorySound(){
  const now = audioContext.currentTime;
  
  // First note
  const osc1 = audioContext.createOscillator();
  const gain1 = audioContext.createGain();
  osc1.connect(gain1);
  gain1.connect(audioContext.destination);
  osc1.frequency.setValueAtTime(523.25, now); // C5
  gain1.gain.setValueAtTime(0.3, now);
  gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
  osc1.start(now);
  osc1.stop(now + 0.25);
  
  // Second note
  const osc2 = audioContext.createOscillator();
  const gain2 = audioContext.createGain();
  osc2.connect(gain2);
  gain2.connect(audioContext.destination);
  osc2.frequency.setValueAtTime(659.25, now + 0.15); // E5
  gain2.gain.setValueAtTime(0.3, now + 0.15);
  gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
  osc2.start(now + 0.15);
  osc2.stop(now + 0.4);
  
  // Third note
  const osc3 = audioContext.createOscillator();
  const gain3 = audioContext.createGain();
  osc3.connect(gain3);
  gain3.connect(audioContext.destination);
  osc3.frequency.setValueAtTime(783.99, now + 0.3); // G5
  gain3.gain.setValueAtTime(0.3, now + 0.3);
  gain3.gain.exponentialRampToValueAtTime(0.01, now + 0.65);
  osc3.start(now + 0.3);
  osc3.stop(now + 0.65);
}

function playGameStartSound(){
  const now = audioContext.currentTime;
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.frequency.setValueAtTime(1200, now);
  osc.frequency.exponentialRampToValueAtTime(1800, now + 0.3);
  gain.gain.setValueAtTime(0.3, now);
  gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
  osc.start(now);
  osc.stop(now + 0.3);
}

let timerInterval = null;

function startTimer(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if(!state.gameActive) {
      clearInterval(timerInterval);
      return;
    }
    const elapsed = Math.floor((Date.now() - state.gameStartTime) / 1000);
    state.timeRemaining = Math.max(0, 180 - elapsed);
    updateChrome(currentId());
    if(state.timeRemaining <= 0){
      state.gameActive = false;
      clearInterval(timerInterval);
      // Auto proceed to final page
      state.pos = state.order.indexOf('final');
      render();
    }
  }, 100);
}

========================================================= */
function esc(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function catMeta(id){ return CATEGORY_META.find(c => c.id === id); }

function goNext(){ state.pos++; render(); }
function goBack(){ if(state.pos > 0){ state.pos--; render(); } }
function skipIntro(){ state.pos = state.order.indexOf('name'); render(); }

function commitCategoriesAndAdvance(){
  const idx = state.order.indexOf('categories');
  const chosenIds = CATEGORY_META.filter(c => state.categories.includes(c.id)).map(c => c.id);
  state.order = state.order.slice(0, idx + 1).concat(['phone', ...chosenIds, 'commitment','fomo','final']);
  state.pos = idx + 1;
  render();
}
function skipCategories(){
  state.categories = [];
  state.otherCategoryText = '';
  commitCategoriesAndAdvance();
}

function shareForm(){
  const text = "Picapool is doing group buying for our PG. Takes under a minute to say what you buy: " + referralUrl();
  trackSlugEvent(state.myRefCode || entrySlug, 'click', { redirectType: 'referral_share' });
  if(navigator.share){
    navigator.share({ text }).catch(()=>{});
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }
}

/* commitment dial, needle animated based on selection */
function getCommitSVG(commitmentLevel){
  // Map commitment levels to needle angle: -54deg (left), 0deg (middle), 54deg (right)
  let angle = -54;
  if(commitmentLevel === 'yes') angle = 54;
  else if(commitmentLevel === 'depends') angle = 0;
  
  return `
<svg viewBox="0 0 280 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A dial measuring how likely you are to join">
  <circle cx="140" cy="118" r="88" fill="#FFF4EB"/>
  <path d="M56 128 A84 84 0 0 1 224 128" fill="none" stroke="#F1EEEA" stroke-width="18" stroke-linecap="round"/>
  <path d="M56 128 A84 84 0 0 1 158 46" fill="none" stroke="#FF4B18" stroke-width="18" stroke-linecap="round" style="transition: stroke-dasharray 0.4s ease;"/>
  <g transform="rotate(${angle} 140 128)" style="transition: transform 0.4s cubic-bezier(.2,.8,.25,1);"><line x1="140" y1="128" x2="140" y2="58" stroke="#15130F" stroke-width="5" stroke-linecap="round"/></g>
  <circle cx="140" cy="128" r="11" fill="#15130F"/>
  <g transform="translate(182,42) rotate(8)">
    <rect width="40" height="30" rx="15" fill="#15130F"/>
    <text x="20" y="20" text-anchor="middle" font-size="15" fill="#FFC94D" font-family="Manrope, sans-serif">✓</text>
  </g>
</svg>`;
}

const contentEl = document.getElementById('content');
const actionsEl = document.getElementById('actions');
const backBtn = document.getElementById('backBtn');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');
const stepTag = document.getElementById('stepTag');

backBtn.addEventListener('click', goBack);

let lastPos = 0;
let lastId = null;

function currentId(){ return state.order[state.pos]; }

function updateChrome(id){
  backBtn.classList.toggle('show', state.pos > 0 && id !== 'final' && id !== 'game');
  const noProgress = ['hook','final'];
  if(noProgress.includes(id)){
    progressTrack.classList.remove('show');
    stepTag.classList.remove('show');
  } else if(state.gameActive){
    // During game, show timer instead of progress
    progressTrack.classList.add('show');
    stepTag.classList.add('show');
    const pct = Math.round(((180 - state.timeRemaining) / 180) * 100);
    progressFill.style.width = pct + '%';
    const mins = Math.floor(state.timeRemaining / 60);
    const secs = state.timeRemaining % 60;
    stepTag.textContent = mins + ':' + (secs < 10 ? '0' : '') + secs;
  } else {
    progressTrack.classList.add('show');
    stepTag.classList.add('show');
    const pct = Math.round((state.pos / (state.order.length - 1)) * 100);
    progressFill.style.width = pct + '%';
    stepTag.textContent = state.pos + ' / ' + (state.order.length - 1);
  }
  lastPos = state.pos;
}

function render(){
  const id = currentId();
  const sameScreen = lastId === id;
  const savedScroll = sameScreen ? contentEl.scrollTop : 0;
  contentEl.innerHTML = screenHTML(id);
  actionsEl.innerHTML = actionsHTML(id);
  updateChrome(id);
  if(sameScreen) {
    contentEl.scrollTop = savedScroll;
  } else {
    contentEl.scrollTop = 0;
  }
  lastId = id;
  wireUp(id);
  logEvent(id);
  syncProgress();
}

        <h1 style="text-align: center;">🎉 Congratulations!</h1>
        <p style="text-align: center; font-size: 15px; color: var(--ink-soft); margin: 8px 0 16px;">You're faster than <strong>${randomPeople} people.</strong></p>
        <p style="text-align: center; font-size: 14px; font-weight: 700; color: var(--ink); margin: 0 0 4px;">You filled in <strong>${filled}/${totalCategories}</strong> categories</p>
        <p style="text-align: center; font-size: 14px; font-weight: 700; color: var(--ink-soft); margin: 0 0 20px;">in <strong>${mins}:${secs < 10 ? '0' : ''}${secs}</strong> minutes</p>
        <div class="final-hero">
          ${UNLOCK_SVG}
          <div class="confetti" id="confettiHost"></div>
        </div>
        <div class="cta-card dark">
          <div class="cta-icon">${ICON_CHAT}</div>
          <div class="cta-text">
            <div class="cta-title">Never miss a drop</div>
            <div class="cta-sub">Join the WhatsApp group</div>
          </div>
          <a class="cta-go" href="${WHATSAPP_GROUP_LINK}" target="_blank" rel="noopener" data-track-cta="wa_group">↗</a>
        </div>
        <div class="cta-card orange">
          <div class="cta-icon">${ICON_DOWNLOAD}</div>
          <div class="cta-text">
            <div class="cta-title">This deal's already live</div>
            <div class="cta-sub">See it on the app</div>
          </div>
          <a class="cta-go" href="${APP_SMART_LINK}" target="_blank" rel="noopener" data-track-cta="app_download">↗</a>
        </div>
        <div class="cta-card" style="background: var(--violet); border-color: var(--ink);">
          <div class="cta-icon">${ICON_SHARE}</div>
          <div class="cta-text">
            <div class="cta-title">Invite a friend</div>
            <div class="cta-sub">They'll beat your score</div>
          </div>
          <button class="cta-go" data-share-form style="cursor: pointer; border: none; background: none; padding: 0;">↗</button>
        </div>
        <div class="center">
        </div>
        <div class="spacer"></div>
      </div>`;
  }

  return '<div class="screen"></div>';
}

/* ---------- bottom action bars ---------- */
function actionsHTML(id){
  if(id === 'hook'){
    return `
      <button class="btn btn-primary" data-go-next>See how it works</button>
      <button class="skip-link" data-skip-intro>Skip, I already know</button>`;
  }
  if(id === 'context'){
    return `
      <button class="btn btn-primary" data-go-next>Tell us what I buy</button>
      <button class="skip-link" data-go-next>Skip</button>`;
  }
  if(id === 'name'){
    return `<button class="btn btn-primary" id="btnName" disabled data-submit-name>Continue</button>`;
  }
  if(id === 'game'){
    return `<button class="btn btn-primary" id="btnGameStart" data-game-start>Start the 3-minute game</button>`;
  }
  if(id === 'categories'){
    const enabled = state.categories.length > 0;
    return `
      <button class="btn btn-primary" id="btnCats" data-submit-cats ${enabled?'':'disabled'}>Continue</button>
      <button class="skip-link" data-skip-cats>Skip for now</button>`;
  }
  if(id === 'phone'){
    return `<button class="btn btn-primary" id="btnPhone" disabled data-submit-phone>Continue</button>`;
  }
  const cat = catMeta(id);
  if(cat){
    return `
      <button class="btn btn-primary" data-go-next>Continue</button>
      <button class="skip-link" data-skip-cat data-cat="${cat.id}">Skip this one</button>`;
  }
  if(id === 'commitment'){
    return `
      <button class="btn btn-primary" data-submit-commit ${state.commitment?'':'disabled'}>Continue</button>
      <button class="skip-link" data-go-next>Skip for now</button>`;
  }
  if(id === 'fomo'){
    return `<button class="btn btn-primary" data-go-next>Show me how to not miss the next one</button>`;
  }
  if(id === 'final'){ return ''; }
  return '';
}

/* ---------- wiring ---------- */
function wireUp(id){
  if(id === 'hook'){
    document.querySelector('[data-go-next]').addEventListener('click', goNext);
    document.querySelector('[data-skip-intro]').addEventListener('click', skipIntro);
  }

  if(id === 'context'){
    document.querySelectorAll('[data-go-next]').forEach(b => b.addEventListener('click', goNext));
  }

  if(id === 'name'){
    const inp = document.getElementById('inpName');
    const btn = document.getElementById('btnName');
    inp.addEventListener('input', () => { btn.disabled = inp.value.trim().length < 2; });
    inp.addEventListener('keydown', e => { if(e.key === 'Enter' && !btn.disabled) submitName(); });
    btn.addEventListener('click', submitName);
    inp.focus();
    function submitName(){ state.name = inp.value.trim(); if(state.name.length < 2) return; goNext(); }
  }

  if(id === 'game'){
    const btn = document.getElementById('btnGameStart');
    btn.addEventListener('click', startGame);
    function startGame(){
      playGameStartSound();
      state.gameActive = true;
      state.gameStartTime = Date.now();
      state.timeRemaining = 180;
      goNext();
      startTimer();
    }
  }

  if(id === 'categories'){
    document.querySelectorAll('[data-cat-chip]').forEach(el => {
      el.addEventListener('click', () => {
        playChipSound();
        const cid = el.dataset.id;
        const i = state.categories.indexOf(cid);
        if(i > -1) state.categories.splice(i, 1); else state.categories.push(cid);
        render();
      });
    });
    const otherInp = document.getElementById('inpOtherCat');
    /* typing doesn't re-render (that would steal focus), so sync explicitly —
       otherwise a typed answer only reaches the Sheet if they tap something
       else afterwards */
    if(otherInp){ otherInp.addEventListener('input', () => { state.otherCategoryText = otherInp.value; syncProgress(); }); otherInp.focus(); }
    document.getElementById('btnCats').addEventListener('click', commitCategoriesAndAdvance);
    document.querySelector('[data-skip-cats]').addEventListener('click', skipCategories);
  }

  if(id === 'phone'){
    const inp = document.getElementById('inpPhone');
    const btn = document.getElementById('btnPhone');
    inp.addEventListener('input', () => { btn.disabled = inp.value.replace(/\D/g,'').length < 10; });
    inp.addEventListener('keydown', e => { if(e.key === 'Enter' && !btn.disabled) submitPhone(); });
    btn.addEventListener('click', submitPhone);
    inp.focus();
    function submitPhone(){ state.phone = inp.value.trim(); if(state.phone.replace(/\D/g,'').length < 10) return; goNext(); }
  }

  const cat = catMeta(id);
  if(cat){
    document.querySelector('[data-go-next]').addEventListener('click', goNext);
    document.querySelector('[data-skip-cat]').addEventListener('click', () => {
      delete state.brandSel[cat.id];
      goNext();
    });

    if(cat.kind === 'flat'){
      if(!state.brandSel[cat.id]) state.brandSel[cat.id] = { picks:[], other:'', otherOn:false };
      const sel = state.brandSel[cat.id];
      document.querySelectorAll('[data-flat-chip]').forEach(el => {
        el.addEventListener('click', () => {
          playChipSound();
          const val = el.dataset.val;
          const i = sel.picks.indexOf(val);
          if(i > -1) sel.picks.splice(i, 1); else sel.picks.push(val);
          render();
        });
      });
      const otherBtn = document.querySelector('[data-flat-other]');
      otherBtn.addEventListener('click', () => {
        sel.otherOn = !sel.otherOn;
        if(!sel.otherOn) sel.other = '';  // matches the nested branch — untoggling drops the typed brand
        render();
      });
      const otherInp = document.getElementById('inpFlatOther');
      if(otherInp){ otherInp.addEventListener('input', () => { sel.other = otherInp.value; syncProgress(); }); otherInp.focus(); }
    } else {
      if(!state.brandSel[cat.id]) state.brandSel[cat.id] = {};
      document.querySelectorAll('[data-group-head]').forEach(el => {
        el.addEventListener('click', () => {
          const c = el.dataset.cat, g = el.dataset.group;
          state.openGroup[c] = (state.openGroup[c] === g) ? null : g;
          render();
        });
      });
      document.querySelectorAll('[data-nest-chip]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          playChipSound();
          const c = el.dataset.cat, g = el.dataset.group, val = el.dataset.val;
          if(!state.brandSel[c][g]) state.brandSel[c][g] = { picks:[], other:'', otherOn: false };
          const gs = state.brandSel[c][g];
          const i = gs.picks.indexOf(val);
          if(i > -1) gs.picks.splice(i, 1); else gs.picks.push(val);
          render();
        });
      });
      document.querySelectorAll('[data-nest-other]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const c = el.dataset.cat, g = el.dataset.group;
          if(!state.brandSel[c][g]) state.brandSel[c][g] = { picks:[], other:'', otherOn: false };
          const gs = state.brandSel[c][g];
          gs.otherOn = !gs.otherOn;
          if(!gs.otherOn) gs.other = '';
          render();
        });
      });
      document.querySelectorAll('[data-cat][id^="inpNestOther-"]').forEach(el => {
        el.addEventListener('input', () => {
          const c = el.dataset.cat, g = el.dataset.group;
          state.brandSel[c][g].other = el.value;
          syncProgress();
        });
      });
      // re-open the group the user last touched, keep focus for typing
      const openG = state.openGroup[cat.id];
      if(openG){
        const oi = document.getElementById('inpNestOther-' + openG);
        if(oi) oi.focus();
      }
    }
  }

  if(id === 'commitment'){
    document.querySelectorAll('[data-commit]').forEach(el => {
      el.addEventListener('click', () => { 
        playDialSound();
        state.commitment = el.dataset.id;
        // Update just the dial without full re-render
        const dial = document.getElementById('commitDial');
        if(dial) dial.innerHTML = getCommitSVG(state.commitment);
        render();
      });
    });
    document.querySelector('[data-submit-commit]').addEventListener('click', () => { if(!state.commitment) return; goNext(); });
    document.querySelectorAll('.skip-link[data-go-next]').forEach(b => b.addEventListener('click', goNext));
  }

  if(id === 'fomo'){
    document.querySelector('[data-go-next]').addEventListener('click', goNext);
  }

  if(id === 'final'){
    playVictorySound();
    const host = document.getElementById('confettiHost');
    const colors = ['#FF4B18','#6C4CF1','#0FAE86','#FFC94D'];
    for(let i = 0; i < 18; i++){
      const s = document.createElement('span');
      s.style.left = (Math.random() * 100) + '%';
      s.style.background = colors[i % colors.length];
      s.style.borderRadius = (i % 2 === 0) ? '50%' : '3px';
      s.style.animationDelay = (Math.random() * 0.4) + 's';
      host.appendChild(s);
    }
    const shareBtn = document.querySelector('[data-share-form]');
    if(shareBtn){
      shareBtn.addEventListener('click', () => {
        const text = "Think you can beat my PG savings score? 🏃‍♂️💨 Take the 3-minute Picapool speed challenge: " + referralUrl();
        trackSlugEvent(state.myRefCode || entrySlug, 'click', { redirectType: 'referral_share' });
        logClick('referral_share');
        if(navigator.share){
          navigator.share({ text }).catch(()=>{});
        } else {
          window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
        }
      });
    }
    document.querySelectorAll('[data-track-cta]').forEach(el => {
      el.addEventListener('click', () => {
        trackSlugEvent(el.dataset.trackCta, 'click', { redirectType: el.dataset.trackCta });
        logClick(el.dataset.trackCta);
      });
    });
  }
}

if(!REDIRECTING){
  if(RESUMED) lastId = null;
  render();
}
</script>

</body>
</html>
